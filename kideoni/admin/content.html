<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content — KIDEONI Admin</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="../index.html" class="logo">KIDE<span class="accent">ONI</span></a>
    <nav class="admin-nav">
      <a href="index.html">📊 Dashboard</a>
      <a href="content.html" class="active">🎬 Movies &amp; Reels</a>
      <a href="analytics.html">📈 Analytics</a>
      <a href="plans.html">💳 Plans</a>
      <a href="../index.html">↩ Back to site</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 style="font-size:30px;">Movies &amp; Reels</h1>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <button class="btn btn-ghost btn-sm tab-btn active" data-tab="movies">Movies</button>
      <button class="btn btn-ghost btn-sm tab-btn" data-tab="reels">Reels</button>
    </div>

    <div id="moviesTab">
      <div class="toolbar">
        <input id="movieSearch" placeholder="Search movies…" style="max-width:260px; padding:10px 12px; background:var(--ink-card); border:1px solid var(--ink-line); border-radius:6px; color:var(--paper);" />
        <button class="btn btn-primary btn-sm" id="newMovieBtn">+ Add movie</button>
      </div>
      <table class="data-table">
        <thead><tr><th></th><th>Title</th><th>Status</th><th>Free</th><th>Views</th><th></th></tr></thead>
        <tbody id="moviesBody"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>

    <div id="reelsTab" style="display:none;">
      <div class="toolbar">
        <input id="reelSearch" placeholder="Search reels…" style="max-width:260px; padding:10px 12px; background:var(--ink-card); border:1px solid var(--ink-line); border-radius:6px; color:var(--paper);" />
        <button class="btn btn-primary btn-sm" id="newReelBtn">+ Add reel</button>
      </div>
      <table class="data-table">
        <thead><tr><th></th><th>Title</th><th>Status</th><th>Views</th><th></th></tr></thead>
        <tbody id="reelsBody"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Movie modal -->
<div class="modal-backdrop" id="movieModal">
  <div class="panel modal-box">
    <h3 id="movieModalTitle" style="margin-bottom:18px;">Add movie</h3>
    <div id="movieMsg" class="form-msg"></div>
    <form id="movieForm">
      <input type="hidden" name="id" />
      <div class="field"><label>Title</label><input name="title" required /></div>
      <div class="field"><label>Slug (URL-safe)</label><input name="slug" required /></div>
      <div class="field"><label>Synopsis</label><textarea name="synopsis" rows="3"></textarea></div>
      <div style="display:flex; gap:12px;">
        <div class="field" style="flex:1;"><label>Release year</label><input name="release_year" type="number" /></div>
        <div class="field" style="flex:1;"><label>Duration (sec)</label><input name="duration_seconds" type="number" /></div>
      </div>
      <div class="field"><label>Genres (comma separated)</label><input name="genres" placeholder="Drama, Romance" /></div>
      <div class="field"><label>Poster image URL</label><input name="poster_url" placeholder="https://…" /></div>
      <div class="field"><label>Backdrop image URL</label><input name="backdrop_url" placeholder="https://…" /></div>
      <div class="field">
        <label>Video file (uploaded to the private "videos" bucket — large/4K files upload in chunks, resumable if interrupted)</label>
        <input name="videoFile" type="file" accept="video/*" />
        <p class="muted" id="currentPathLabel" style="margin-top:6px;"></p>
        <div class="upload-progress-track" id="movieUploadTrack" style="display:none;">
          <div class="upload-progress-fill" id="movieUploadFill"></div>
        </div>
        <p class="muted" id="movieUploadPct" style="margin-top:4px;"></p>
      </div>
      <div style="display:flex; gap:20px; margin: 6px 0 20px;">
        <label style="display:flex; align-items:center; gap:8px; font-size:14px;"><input type="checkbox" name="is_free" /> Free title</label>
        <label style="display:flex; align-items:center; gap:8px; font-size:14px;"><input type="checkbox" name="is_published" /> Published</label>
        <label style="display:flex; align-items:center; gap:8px; font-size:14px;"><input type="checkbox" name="is_featured" /> Featured</label>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary">Save movie</button>
        <button type="button" class="btn btn-ghost" id="cancelMovieBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Reel modal -->
<div class="modal-backdrop" id="reelModal">
  <div class="panel modal-box">
    <h3 id="reelModalTitle" style="margin-bottom:18px;">Add reel</h3>
    <div id="reelMsg" class="form-msg"></div>
    <form id="reelForm">
      <input type="hidden" name="id" />
      <div class="field"><label>Title</label><input name="title" required /></div>
      <div class="field"><label>Caption</label><textarea name="caption" rows="2"></textarea></div>
      <div class="field"><label>Thumbnail image URL</label><input name="thumbnail_url" placeholder="https://…" /></div>
      <div class="field">
        <label>Video file (uploaded to the private "videos" bucket — large/4K files upload in chunks, resumable if interrupted)</label>
        <input name="videoFile" type="file" accept="video/*" />
        <p class="muted" id="currentReelPathLabel" style="margin-top:6px;"></p>
        <div class="upload-progress-track" id="reelUploadTrack" style="display:none;">
          <div class="upload-progress-fill" id="reelUploadFill"></div>
        </div>
        <p class="muted" id="reelUploadPct" style="margin-top:4px;"></p>
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:20px;"><input type="checkbox" name="is_published" checked /> Published</label>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary">Save reel</button>
        <button type="button" class="btn btn-ghost" id="cancelReelBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-content.js"></script>
</body>
</html>
