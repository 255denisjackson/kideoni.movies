<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plans — KIDEONI MOVIES</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">KIDE<span class="accent">ONI</span></a>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="browse.html">Movies</a>
      <a href="reels.html">Reels</a>
      <a href="pricing.html" class="active">Plans</a>
    </div>
    <div class="nav-right">
      <div id="navAuthSlot" style="display:flex; gap:10px; align-items:center;"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

<main class="wrap section">
  <div class="center" style="max-width:600px; margin: 0 auto 40px;">
    <h1>Pick a plan</h1>
    <p class="lede center" style="margin:14px auto;">Free reels for everyone. Unlock the full movie library with a plan that fits you — pay securely with PayIn.</p>
  </div>

  <div class="plans-grid" id="plansGrid">
    <div class="plan-card skeleton" style="height:340px;"></div>
    <div class="plan-card skeleton" style="height:340px;"></div>
    <div class="plan-card skeleton" style="height:340px;"></div>
  </div>
</main>

<!-- Checkout modal -->
<div id="checkoutModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:20px;">
  <div class="panel auth-card">
    <h3 style="margin-bottom:6px;">Complete your subscription</h3>
    <p class="muted" id="checkoutPlanLabel" style="margin-bottom:18px;"></p>
    <div id="checkoutMsg" class="form-msg"></div>
    <div class="field">
      <label for="phoneInput">Mobile money number</label>
      <input id="phoneInput" type="tel" placeholder="e.g. 07XXXXXXXX" />
    </div>
    <button id="payBtn" class="btn btn-primary btn-block">Pay with PayIn</button>
    <button id="closeCheckout" class="btn btn-ghost btn-block" style="margin-top:10px;">Cancel</button>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="logo" style="font-size:20px;">KIDE<span class="accent">ONI</span> MOVIES</div>
    <div>© <span id="year"></span> KIDEONI MOVIES. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/nav.js"></script>
<script src="js/payments.js"></script>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
loadPlans();
</script>
</body>
</html>
