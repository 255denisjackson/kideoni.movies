<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create account — KIDEONI MOVIES</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="center" style="margin-bottom:26px;">
      <a href="index.html" class="logo" style="font-size:34px;">KIDE<span class="accent">ONI</span></a>
    </div>
    <div class="panel">
      <h2 style="margin-bottom:6px;">Create your account</h2>
      <p class="muted" style="margin-bottom:22px;">Free reels instantly. Upgrade any time for full movies.</p>

      <div id="formMsg" class="form-msg"></div>

      <form id="signupForm">
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>
    <div class="auth-links">Already have an account? <a href="login.html">Sign in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", handleSignup);
</script>
</body>
</html>
